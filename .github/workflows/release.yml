name: Release

# Push a tag like v0.1.0 to build every edition and publish them as a release: the Windows installer, the Linux
# .deb, the macOS disk image, the web app (a folder of files for any web space), the Android .apk and the iOS app.
# Run it by hand (Actions > Release > Run workflow) to build them without publishing.
#
# Android: without the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS the .apk is
# a debug build (it installs, but a later build will not install over it). iOS: the .ipa is not signed; it goes
# onto a phone through Xcode or a sideloading tool with your Apple ID, or to TestFlight once it is signed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: packaging/build_bundle.sh
      - name: Smoke test
        run: dist/pdfdesk/pdfdesk commands
      - name: Version
        run: echo "VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_ENV"
      - run: packaging/build_deb.sh "$VERSION"
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist/*.deb

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: packaging/build_bundle.sh
      - name: Version
        run: echo "VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_ENV"
      - name: Installer
        run: |
          command -v iscc || choco install innosetup -y --no-progress
          iscc //DMyAppVersion="$VERSION" packaging/pdfdesk.iss
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/*.exe

  macos:
    runs-on: macos-latest          # Apple silicon; PaddleOCR has no build for Intel Macs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: packaging/build_bundle.sh
      - name: Smoke test
        run: dist/pdfdesk.app/Contents/MacOS/pdfdesk commands
      - name: Version
        run: echo "VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_ENV"
      - run: packaging/build_dmg.sh "$VERSION"
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: dist/*.dmg

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Commands on the browser's Python
        run: node scripts/pytest.mjs
      - name: The app in a browser
        run: npx playwright install --with-deps chromium && node scripts/smoke.mjs
      - name: Zip
        run: |
          VERSION=$(node -p "require('./package.json').version")
          (cd dist && zip -qr "../pdfdesk-web-$VERSION.zip" .)
      - uses: actions/upload-artifact@v5
        with:
          name: web
          path: web/pdfdesk-web-*.zip

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:native
      - name: Build the .apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pdfdesk.keystore"
            ANDROID_KEYSTORE="$RUNNER_TEMP/pdfdesk.keystore" ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../pdfdesk-$VERSION.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../pdfdesk-$VERSION-debug.apk"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: web/pdfdesk-*.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:native
      - name: Build the app (not signed)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/pdfdesk.xcarchive" MARKETING_VERSION="$VERSION" CODE_SIGNING_ALLOWED=NO archive
          mkdir Payload
          cp -R "$RUNNER_TEMP/pdfdesk.xcarchive/Products/Applications/App.app" Payload/
          zip -qry "pdfdesk-$VERSION-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v5
        with:
          name: ios
          path: web/pdfdesk-*.ipa

  release:
    # the editions that built are published; only Windows and Linux are required
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    needs: [linux, windows, macos, web, android, ios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "pdfdesk $GITHUB_REF_NAME" \
            --notes "Windows: run pdfdesk-setup-*.exe. Linux (Ubuntu 24.04+): sudo apt install ./pdfdesk_*_amd64.deb. macOS (Apple silicon): open the .dmg and drag pdfdesk to Applications. Android: open the .apk on the phone. Web: unzip pdfdesk-web-*.zip into any web space. iPhone and iPad: the .ipa is not signed, see INSTALL.md."
