name: Release

# Push a tag like v0.1.0 to build the Windows installer and the Linux .deb and publish them as a release.
# Run it by hand (Actions > Release > Run workflow) to build both without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: packaging/build_bundle.sh
      - name: Smoke test
        run: dist/pdfdesk/pdfdesk commands
      - name: Version
        run: echo "VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_ENV"
      - run: packaging/build_deb.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.deb

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: packaging/build_bundle.sh
      - name: Version
        run: echo "VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_ENV"
      - name: Installer
        run: |
          command -v iscc || choco install innosetup -y --no-progress
          iscc //DMyAppVersion="$VERSION" packaging/pdfdesk.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "pdfdesk $GITHUB_REF_NAME" \
            --notes "Windows: run pdfdesk-setup-*.exe. Linux (Ubuntu 24.04+): sudo apt install ./pdfdesk_*_amd64.deb"
