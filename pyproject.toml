[project]
name = "pdfdesk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pymupdf>=2.0", "pikepdf>=10.17", "PySide6>=6.12", "ocrmypdf>=17.13", "pyHanko>=0.38", "pdf2docx>=0.5.13",
  "pdfplumber>=0.11", "openpyxl>=3.1", "python-docx>=1.2", "python-pptx>=1.0", "img2pdf>=0.6", "pillow>=13",
  "cryptography>=50", "numpy>=2",
]

[project.scripts]
pdfdesk = "pdfdesk.cli:main"

[tool.setuptools.packages.find]
include = ["pdfdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
